[project]
name = "pipeline-toys"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Wendislau Silva", email = "wendislau_victor@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "duckdb>=2.0.0",
    "pandas>=3.1.1",
    "streamlit>=1.67.0",
]

[project.scripts]
pipeline-toys = "pipeline_toys:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
