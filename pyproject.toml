[project]
name = "pipeline-toys"
version = "0.1.0"
description = "Pipeline raw → refined → marts sobre as vendas da Maven Toys, com DuckDB e Streamlit"
readme = "README.md"
authors = [
    { name = "Wendislau Silva", email = "wendislau_victor@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "duckdb>=2.0.0",
    "pandas>=3.1.1",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["test", "tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["."]
omit = ["app.py", "test*/*", ".venv/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true
